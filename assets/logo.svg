<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F97316" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="#2E2E38" stroke-width="2" />

  <!-- Notebook Page Outline -->
  <rect x="52" y="44" width="152" height="168" rx="16" fill="#25252E" stroke="#3F3F4E" stroke-width="2" />
  
  <!-- Code/Notebook Cell Header Lines -->
  <rect x="74" y="66" width="48" height="6" rx="3" fill="#6366F1" opacity="0.8" />
  <rect x="130" y="66" width="24" height="6" rx="3" fill="#4B5563" opacity="0.6" />
  <rect x="74" y="82" width="108" height="4" rx="2" fill="#374151" />
  <rect x="74" y="94" width="76" height="4" rx="2" fill="#374151" />

  <!-- Distinctive Infinity Bridge Loop (Connecting Local Agent to Cloud Notebook) -->
  <g transform="translate(128, 148)" filter="url(#glow)">
    <!-- Left Loop -->
    <path d="M -24 0 C -42 -22 -64 -18 -64 0 C -64 18 -42 22 -24 0 Z" 
          fill="none" stroke="url(#loopGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Loop -->
    <path d="M 24 0 C 42 -22 64 -18 64 0 C 64 18 42 22 24 0 Z" 
          fill="none" stroke="url(#loopGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Central Bridge Node -->
    <circle cx="0" cy="0" r="6" fill="#FBBF24" />
  </g>
</svg>
