    <path d="M 80 104 C 58 104 44 88 44 72 C 44 56 58 40 80 40 C 100 40 114 56 128 72 C 114 88 100 104 80 104 Z" fill="#1E1E1E" />

    <!-- Right Loop (Orange) -->
