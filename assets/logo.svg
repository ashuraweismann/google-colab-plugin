      <stop offset="0%" stop-color="#F9AB00" />
      <stop offset="100%" stop-color="#E37400" />
    </linearGradient>
    <linearGradient id="colabOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E0F" />
      <stop offset="100%" stop-color="#D56B00" />
